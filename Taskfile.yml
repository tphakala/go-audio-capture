# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages (CGO disabled, the whole point of this library)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build ./...

  build-arm64:
    desc: Cross-build for linux/arm64 (the Pi Zero 2 W target)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build ./...

  build-arm:
    desc: Cross-build for linux/arm (32-bit ILP32, e.g. armv7 Raspberry Pi)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm
    cmds:
      - go build ./...

  build-386:
    desc: Cross-build for linux/386 (32-bit ILP32)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: '386'
    cmds:
      - go build ./...

  test:
    desc: Run all tests (CGO disabled)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector (needs CGO for -race)
    cmds:
      - go test -race ./...

  test:ilp32:
    desc: Run tests as 386 binaries so the ILP32 layout assertions execute (no -race; unsupported on 386). Needs an x86_64 host with 32-bit exec support.
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: '386'
    cmds:
      - go test ./...

  vet:
    desc: Run go vet for amd64, arm64, arm, and 386
    cmds:
      - GOARCH=amd64 go vet ./...
      - GOARCH=arm64 go vet ./...
      - GOARCH=arm go vet ./...
      - GOARCH=386 go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "These files are not gofmt-formatted (run: gofmt -w .):"
          echo "$files"
          exit 1
        fi

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Full local gate (build amd64/arm64/arm/386, vet, lint, fmt, race + ILP32 tests)
    cmds:
      - task: build
      - task: build-arm64
      - task: build-arm
      - task: build-386
      - task: vet
      - task: lint
      - task: fmt
      - task: test:race
      - task: test:ilp32
