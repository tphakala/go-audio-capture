# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages (CGO disabled, the whole point of this library)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build ./...

  build-arm64:
    desc: Cross-build for linux/arm64 (the Pi Zero 2 W target)
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build ./...

  test:
    desc: Run all tests (CGO disabled)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector (needs CGO for -race)
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet for amd64 and arm64
    cmds:
      - GOARCH=amd64 go vet ./...
      - GOARCH=arm64 go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "These files are not gofmt-formatted (run: gofmt -w .):"
          echo "$files"
          exit 1
        fi

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Full local gate (build, arm64 build, vet, lint, fmt, race tests)
    cmds:
      - task: build
      - task: build-arm64
      - task: vet
      - task: lint
      - task: fmt
      - task: test:race
