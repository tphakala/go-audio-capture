name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'
  # Pinned to match the local toolchain so the linter version is identical
  # across developer machines and CI.
  GOLANGCI_LINT_VERSION: 'v2.13.2'

permissions:
  contents: read

# Phase 1 is the Linux ALSA backend; phase 2 adds the Windows WASAPI backend.
# CI builds/tests on Linux and Windows and cross-compiles the Windows target
# from the Linux job so a break is caught from either side. (macOS/CoreAudio
# grows the matrix further when it lands.)
jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...

      - name: Build (linux/arm64, CGO disabled)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      - name: Cross-compile Windows target (windows/amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      - name: Test with coverage
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      # The GitHub Windows runner has no capture hardware; the enumeration
      # integration test skips gracefully on an empty device list, and the rest
      # of the suite is seam-injected and hardware-free.
      - name: Test with race detector
        run: go test -race ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi
      - name: golangci-lint (GOOS=${{ matrix.goos }})
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
